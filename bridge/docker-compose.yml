# Bridge host: a private Matrix homeserver, the mautrix bridges, and the
# adapter that turns bridged rooms into the connector contract for Convex.
# Only the adapter is published; the homeserver and bridges stay on the
# internal network. Run scripts/init.sh once to write .env.
name: fomovoider-bridge

x-restart: &restart
  restart: unless-stopped

services:
  # Writes the appservice registrations Synapse loads, from the tokens in .env.
  registrations:
    image: alpine:3.22
    env_file: .env
    volumes:
      - ./scripts/render-registrations.sh:/render.sh:ro
      - appservices:/appservices
    command: ["sh", "/render.sh"]

  synapse:
    <<: *restart
    image: matrixdotorg/synapse:v1.165.0
    depends_on:
      registrations:
        condition: service_completed_successfully
    volumes:
      - ./synapse/homeserver.yaml:/config/homeserver.yaml:ro
      - appservices:/appservices:ro
      - synapse:/data
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python -m synapse.app.homeserver -c /config/homeserver.yaml --keys-directory /data --generate-keys &&
        exec python -m synapse.app.homeserver -c /config/homeserver.yaml --keys-directory /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  whatsapp:
    <<: *restart
    image: dock.mau.dev/mautrix/whatsapp:v26.10
    depends_on:
      synapse:
        condition: service_healthy
    working_dir: /data
    entrypoint: ["sh", "-c", "chown -R 1337:1337 /data && exec su-exec 1337:1337 /usr/bin/mautrix-whatsapp -c /config/config.yaml --no-update"]
    environment:
      WA_APPSERVICE__AS_TOKEN: ${WA_AS_TOKEN}
      WA_APPSERVICE__HS_TOKEN: ${WA_HS_TOKEN}
      WA_PROVISIONING__SHARED_SECRET: ${WA_PROVISIONING_SECRET}
      # Double puppeting through the adapter's appservice: the bridge acts as
      # the adapter's @fv_ users, so messages sent from the phone show up as
      # the account owner's own.
      WA_DOUBLE_PUPPET__SECRETS__BRIDGE__LOCAL: as_token:${ADAPTER_AS_TOKEN}
    volumes:
      - ./whatsapp/config.yaml:/config/config.yaml:ro
      - whatsapp:/data

  # Facebook Messenger through mautrix-meta. Opt in with --profile messenger
  # and set MESSENGER_URL=http://messenger:29319 in .env for the adapter.
  messenger:
    <<: *restart
    profiles: [messenger]
    image: dock.mau.dev/mautrix/meta:v26.10
    depends_on:
      synapse:
        condition: service_healthy
    working_dir: /data
    entrypoint: ["sh", "-c", "chown -R 1337:1337 /data && exec su-exec 1337:1337 /usr/bin/mautrix-meta -c /config/config.yaml --no-update"]
    environment:
      FB_APPSERVICE__AS_TOKEN: ${FB_AS_TOKEN}
      FB_APPSERVICE__HS_TOKEN: ${FB_HS_TOKEN}
      FB_PROVISIONING__SHARED_SECRET: ${FB_PROVISIONING_SECRET}
      FB_DOUBLE_PUPPET__SECRETS__BRIDGE__LOCAL: as_token:${ADAPTER_AS_TOKEN}
    volumes:
      - ./messenger/config.yaml:/config/config.yaml:ro
      - messenger:/data

  adapter:
    <<: *restart
    build:
      context: ..
      dockerfile: bridge/adapter/Dockerfile
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      HOMESERVER_URL: http://synapse:8008
      SERVER_NAME: bridge.local
      AS_TOKEN: ${ADAPTER_AS_TOKEN}
      HS_TOKEN: ${ADAPTER_HS_TOKEN}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL}
      WHATSAPP_URL: http://whatsapp:29318
      WHATSAPP_AS_TOKEN: ${WA_AS_TOKEN}
      WHATSAPP_PROVISIONING_SECRET: ${WA_PROVISIONING_SECRET}
      MESSENGER_URL: ${MESSENGER_URL:-}
      MESSENGER_AS_TOKEN: ${FB_AS_TOKEN}
      MESSENGER_PROVISIONING_SECRET: ${FB_PROVISIONING_SECRET}
      STATE_FILE: /data/state.json
    volumes:
      - adapter:/data
    # Lets a local Convex backend on the host be CONVEX_SITE_URL in development.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${ADAPTER_PORT:-8080}:8080"

volumes:
  appservices:
  synapse:
  whatsapp:
  messenger:
  adapter:
